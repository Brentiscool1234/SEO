appId: com.seoaudit.app
productName: SEO Audit Tool
copyright: Copyright © 2025

# What to include in the packaged app
files:
  - electron/**/*
  - .next/**/*
  - public/**/*
  - node_modules/**/*
  - package.json
  - next.config.ts

# Extra resources bundled alongside the app
extraResources:
  - from: .
    to: app
    filter:
      - .next
      - public
      - node_modules
      - package.json
      - next.config.ts

directories:
  buildResources: electron/build
  output: dist

# Windows NSIS installer
win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/icon.ico

nsis:
  oneClick: false               # Show install wizard
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SEO Audit Tool
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  installerHeaderIcon: electron/icon.ico
  deleteAppDataOnUninstall: false

# Mac (bonus — works if built on Mac)
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: electron/icon.icns
  category: public.app-category.productivity

# Linux AppImage
linux:
  target: AppImage
  icon: electron/icon.png
  category: Utility
